<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movido al Hero Hub · Solicitud de cuenta</title>
  <meta http-equiv="refresh" content="6; url=https://hub.heroinsuranceusa.com/solicitud-cuenta.html">
  <link rel="canonical" href="https://hub.heroinsuranceusa.com/solicitud-cuenta.html">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Inter',system-ui,sans-serif; background:#f0f4f8; color:#0a3d4a;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .card{
      background:#fff; border-radius:20px; padding:44px 40px;
      max-width:520px; text-align:center;
      box-shadow:0 12px 40px rgba(6,163,182,.15);
      border:1px solid rgba(10,61,74,.10);
    }
    .badge{
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(6,163,182,.10); color:#06a3b6;
      padding:6px 14px; border-radius:999px;
      font-size:11px; font-weight:800; letter-spacing:2.5px; text-transform:uppercase;
      margin-bottom:20px;
    }
    h1{
      font-family:'Bricolage Grotesque',system-ui,sans-serif; font-style:italic;
      font-weight:800; font-size:34px; line-height:1.1; margin-bottom:14px;
    }
    p{ font-size:14px; color:#5a7480; line-height:1.6; margin-bottom:22px; }
    p strong{ color:#0a3d4a; }
    .url{
      font-family:'JetBrains Mono',ui-monospace,monospace;
      color:#06a3b6; font-size:13px; word-break:break-all;
    }
    .btn{
      display:inline-flex; align-items:center; gap:10px;
      background:linear-gradient(135deg,#06a3b6,#0891a3); color:#fff;
      padding:14px 30px; border-radius:999px;
      text-decoration:none; font-weight:700; font-size:14px;
      box-shadow:0 8px 22px rgba(6,163,182,.32);
      transition:transform .12s, box-shadow .18s;
    }
    .btn:hover{ transform:translateY(-1px); box-shadow:0 12px 28px rgba(6,163,182,.42); }
    .countdown{
      margin-top:16px; font-size:12px; color:#8ba0aa;
      letter-spacing:.3px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Página movida</div>
    <h1>Este formulario se mudó al Hero Hub</h1>
    <p>
      La solicitud de alta/baja de cuentas corporativas ahora vive dentro del
      Hero Hub, en el dominio oficial de Hero Insurance USA.
      <br><br>
      <span class="url">hub.heroinsuranceusa.com/solicitud-cuenta.html</span>
    </p>
    <a class="btn" href="https://hub.heroinsuranceusa.com/solicitud-cuenta.html">
      Ir al nuevo formulario →
    </a>
    <div class="countdown">Redirección automática en <span id="c">6</span>s…</div>
  </main>
  <script>
    var n = 6;
    var el = document.getElementById('c');
    setInterval(function(){
      n--;
      if (n < 0) return;
      el.textContent = n;
    }, 1000);
  </script>
</body>
</html>
